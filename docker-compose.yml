services:
  school-api:
    build:
      context: ./school-api
    container_name: school-api
    ports:
      - "3000:3000"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSLMODE: ${DB_SSLMODE}
    restart: unless-stopped

  school-front:
    build:
      context: ./school-backendfronted
    container_name: school-front
    ports:
      - "8000:80"
    environment:
      API_BASE_URL: http://school-api:3000
    depends_on:
      - school-api
    restart: unless-stopped